<div class="funda-app-container">
    <div class="funda-sidebar">
        <div>
            <h1 class="funda-logo">Funda AI Guide</h1>
            <button id="funda-new-chat" class="funda-submit-btn"
                style="width: 100%; margin-bottom: 20px; height: 38px;">+ New Chat</button>
            <label style="font-size: 12px; color: #9ca3af; text-transform: uppercase;">Curriculum Level</label>
            <select id="funda-tier" class="funda-tier-select">
                <option value="All Levels">All Levels</option>
                <option value="Primary">Primary</option>
                <option value="Junior High">Junior High</option>
                <option value="Senior High">Senior High</option>
            </select>

            <div style="font-size: 12px; color: #9ca3af; text-transform: uppercase; margin: 15px 0 10px 0;">Chat History
            </div>
            <div id="funda-history-list"
                style="display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 40vh;">
            </div>
        </div>
        <div style="font-size: 12px; color: #9ca3af;">Local-First RAG Intelligence</div>
    </div>

    <div class="funda-chat-area">
        <div id="funda-messages" class="funda-messages">
            <div class="funda-msg-row assistant">
                <div class="funda-msg-box assistant">Hi! I am Funda, your Heritage-Based Curriculum guide. What stage of
                    your project are you working on today?</div>
            </div>
        </div>

        <div class="funda-prompt-form">
            <textarea id="funda-input" class="funda-prompt-input" rows="1"
                placeholder="Ask about your project methodology, data tools, or topic ideas..."></textarea>
            <button id="funda-submit" class="funda-submit-btn">Send</button>
        </div>
    </div>
</div>
