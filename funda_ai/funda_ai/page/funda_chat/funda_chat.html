<style>
    /* Scoped Dark/Cyan Aesthetic */
    .funda-app-container { display: flex; height: 80vh; background-color: #131314; color: #e3e3e3; font-family: system-ui, -apple-system, sans-serif; border-radius: 8px; overflow: hidden; border: 1px solid #333537; }
    .funda-sidebar { width: 260px; background-color: #1e1f20; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #333537; flex-shrink: 0; }
    .funda-logo { font-size: 20px; font-weight: bold; color: #22d3ee; margin-bottom: 24px; letter-spacing: 0.05em; }
    .funda-tier-select { width: 100%; background-color: #131314; border: 1px solid #444746; color: #fff; padding: 10px; border-radius: 6px; outline: none; margin-bottom: 20px; }
    .funda-chat-area { flex: 1; display: flex; flex-direction: column; position: relative; }
    .funda-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .funda-msg-row { display: flex; width: 100%; }
    .funda-msg-row.user { justify-content: flex-end; }
    .funda-msg-box { max-width: 75%; padding: 14px 18px; border-radius: 12px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
    .funda-msg-box.user { background-color: #333537; color: #fff; border-bottom-right-radius: 4px; }
    .funda-msg-box.assistant { background-color: #1e1f20; border: 1px solid #333537; border-bottom-left-radius: 4px; }
    .funda-prompt-form { padding: 16px; background-color: #131314; border-top: 1px solid #333537; display: flex; gap: 10px; }
    .funda-prompt-input { flex: 1; background-color: #1e1f20; border: 1px solid #333537; border-radius: 9999px; padding: 12px 24px; color: #fff; outline: none; }
    .funda-prompt-input:focus { border-color: #444746; }
    .funda-submit-btn { background-color: #0891b2; color: white; border: none; border-radius: 9999px; padding: 0 20px; cursor: pointer; transition: background-color 0.2s; }
    .funda-submit-btn:hover { background-color: #22d3ee; }
    .funda-submit-btn:disabled { background-color: #333537; cursor: not-allowed; }
</style>

<div class="funda-app-container">
    <div class="funda-sidebar">
        <div>
            <h1 class="funda-logo">Funda AI Guide</h1>
            <label style="font-size: 12px; color: #9ca3af; text-transform: uppercase;">Curriculum Level</label>
            <select id="funda-tier" class="funda-tier-select">
                <option value="all">All Levels</option>
                <option value="primary">Primary (Grade 3-7)</option>
                <option value="junior_high">Junior High (O-Level)</option>
                <option value="senior_high">Senior High (A-Level)</option>
            </select>
        </div>
        <div style="font-size: 12px; color: #9ca3af;">Local-First RAG Intelligence</div>
    </div>

    <div class="funda-chat-area">
        <div id="funda-messages" class="funda-messages">
            <div class="funda-msg-row assistant">
                <div class="funda-msg-box assistant">Hi! I am Funda, your Heritage-Based Curriculum guide. What stage of your project are you working on today?</div>
            </div>
        </div>

        <div class="funda-prompt-form">
            <input type="text" id="funda-input" class="funda-prompt-input" placeholder="Ask about your project methodology, data tools, or topic ideas..." />
            <button id="funda-submit" class="funda-submit-btn">Send</button>
        </div>
    </div>
</div>
